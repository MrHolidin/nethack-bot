name: eval
on:
  workflow_dispatch:
    inputs:
      tag:   {description: "run name", required: true, default: "run"}
      chars: {description: "space-separated character codes (val, mon, @ = random, val-hum-law-fem ...)", required: true, default: "@"}
      n:     {description: "games per shard", required: true, default: "40"}
      shards: {description: "shards per character (seed ranges)", required: true, default: "4"}
      start: {description: "first seed", required: true, default: "10000"}
      kw:    {description: "Bot kwargs as JSON", required: true, default: "{}"}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          chars = "${{ inputs.chars }}".split()
          n, shards, start = int("${{ inputs.n }}"), int("${{ inputs.shards }}"), int("${{ inputs.start }}")
          inc = [{"char": c, "start": start + i * n, "n": n} for c in chars for i in range(shards)]
          print("matrix=" + json.dumps({"include": inc}))
          PY

  run:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements.txt}
      - run: pip install -r requirements.txt
      - name: play
        env:
          KW: ${{ inputs.kw }}
        run: |
          J=$(nproc)
          SAFE=$(echo "${{ matrix.char }}" | tr -c 'A-Za-z0-9\n' '_')
          python eval.py -n ${{ matrix.n }} --start ${{ matrix.start }} --char "${{ matrix.char }}" \
            --kw "$KW" -j $J --out "res_${SAFE}_${{ matrix.start }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: res-${{ strategy.job-index }}
          path: res_*.jsonl

  merge:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {path: parts, pattern: "res-*", merge-multiple: true}
      - name: push results to the results branch
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" repo
          cd repo
          if git ls-remote --exit-code origin results >/dev/null; then
            git fetch --depth 1 origin results && git checkout -B results FETCH_HEAD
          else
            git checkout --orphan results && git rm -rf -q .
          fi
          mkdir -p results
          cat ../parts/*.jsonl > "results/${{ inputs.tag }}.jsonl"
          wc -l "results/${{ inputs.tag }}.jsonl"
          git add results
          git commit -q -m "results: ${{ inputs.tag }} (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do
            git push origin HEAD:results && break
            git fetch --depth 1 origin results && git rebase FETCH_HEAD
          done
